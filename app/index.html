{{#> app-layout}}
<main>
  <section class="tower" aria-label="ملخص اليوم">
    <div class="tower-in">
      <div class="tower-head">
        <div>
          <h1>مرحباً، محمد</h1>
          <p class="tower-sub" id="hello-sub"></p>
          <div class="exc" id="exc"></div>
        </div>
        <div class="flex flex-wrap gap-2.5">
          <a class="btn btn-line" href="{{base}}app/deals.html">صفقات المساحات</a>
          <a class="btn btn-primary" href="{{base}}app/rates.html">احصل على سعر شحنة</a>
        </div>
      </div>
      <div class="kpi-row" id="kpis"></div>
    </div>
  </section>
  <div class="ov-wrap">
    <div class="ov-col">
      <section class="pnl lift" id="attention" aria-label="يحتاج انتباهك"></section>
      <section class="pnl ships" id="ships" aria-label="شحناتي النشطة"></section>
      <section class="pnl" id="trend" aria-label="اتجاه السعر"></section>
    </div>
    <div class="ov-col">
      <section class="pnl map-dark" id="mapcard" aria-label="خريطة الحاويات"></section>
      <section id="mini-deals" aria-label="صفقات على مساراتي"></section>
      <section id="watch" aria-label="المسارات التي أتابعها"></section>
    </div>
  </div>
</main>
<script type="module" src="/src/js/pages/overview.js"></script>
{{/app-layout}}
