<header class="topbar">
  <div class="topbar-in">
    <a class="logo" href="{{base}}app/" aria-label="لاندد">{{> logo}}</a>
    <nav class="navlinks" aria-label="التنقل">{{> app-nav-links}}</nav>
    <div class="flex-1"></div>
    <button class="cmdk-trigger hidden xl:flex" data-act="palette" type="button" aria-label="بحث سريع">
      <svg class="ic sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span>ابحث عن حاوية أو مسار</span><kbd>⌘K</kbd>
    </button>
    <div class="seg" role="group" aria-label="العملة">
      <button data-act="currency" data-v="SAR" aria-pressed="true">ر.س</button>
      <button data-act="currency" data-v="USD" aria-pressed="false">USD</button>
    </div>
    <div class="popw relative">
      <button class="iconbtn" data-act="bell" aria-label="التنبيهات"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.3 20a2 2 0 0 0 3.4 0"/></svg><span class="bd"></span></button>
      <div class="pop" id="notif-pop" hidden></div>
    </div>
    <div class="flex items-center gap-2.5">
      <div class="av !h-9 !w-9 !rounded-full !bg-aqua !text-nav">م</div>
      <div class="hidden leading-tight md:block"><b class="block text-[13.5px] text-white">محمد</b><small class="text-xs text-nav-mute">مؤسسة الرواد للاستيراد</small></div>
    </div>
  </div>
  <nav class="subnav" aria-label="التنقل">{{> app-nav-links}}</nav>
</header>
