{{#> site-layout}}
<main>
  <section class="border-b border-line bg-surface">
    <div class="wrap py-10 lg:py-14">
      <div class="kick">مصادر البيانات</div>
      <h1 class="max-w-[40rem] text-[clamp(1.8rem,3.4vw,2.6rem)] font-bold leading-[1.25]">من أين تأتي أسعارنا وبيانات حاوياتك؟</h1>
      <p class="mt-4 max-w-[46rem] text-[16.5px] leading-8 text-ink-2" id="principle"></p>
      <div class="mt-5 flex flex-wrap items-center gap-x-5 gap-y-2 text-[13px] text-mute" id="meta"></div>
    </div>
  </section>

  <section class="border-b border-line">
    <div class="wrap py-8">
      <h2 class="mb-4 text-[15px] font-bold">رحلة الحاوية ومصادر كل مرحلة</h2>
      <div class="grid items-stretch gap-3 md:grid-cols-[1fr_auto_1fr_auto_1fr]" id="flow"></div>
    </div>
  </section>

  <section class="sec !pb-10">
    <div class="wrap">
      <div class="mb-5 flex flex-wrap items-center gap-2" id="filters" role="group" aria-label="تصفية حسب النوع"></div>
      <div class="flex flex-col gap-8" id="groups"></div>
    </div>
  </section>

  <section class="sec alt !py-10">
    <div class="wrap grid gap-5 md:grid-cols-3" id="notes"></div>
  </section>
</main>
<script type="module" src="/src/js/pages/resource.js"></script>
{{/site-layout}}
